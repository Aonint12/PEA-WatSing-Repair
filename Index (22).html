<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="icon" href="https://raw.githubusercontent.com/Aonint12/images/main/pea_logo_big.png">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',sans-serif;background:#f4f1f8;color:#222}
  header{background:#74045f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px} header p{margin:2px 0 0;font-size:13px;opacity:.85}
  .logo{height:52px;width:52px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
  .addbtn{background:#fff;color:#74045f;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:600;font-size:14px}
  .tabs{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd}
  .tabs button{border:1px solid #74045f;background:#fff;color:#74045f;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
  .tabs button.on{background:#74045f;color:#fff}
  .wrap{display:flex;height:calc(100vh - 118px)}
  #list{width:420px;overflow-y:auto;padding:12px}
  #map{flex:1}
  .card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;border-left:5px solid #f59f00;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card.today{border-left-color:#e03131}.card.past{border-left-color:#999;opacity:.75}
  .card h3{margin:0 0 6px;font-size:16px}
  .row{font-size:14px;margin:2px 0}.row b{color:#555}
  .slot{font-size:14px;margin:1px 0 1px 12px}
  .badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#fff3bf;margin-bottom:6px}
  .card.today .badge{background:#ffe3e3;color:#c92a2a}
  .pbtn{margin-top:8px;font-family:inherit;border:1px solid #74045f;background:#fff;color:#74045f;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
  .empty{text-align:center;color:#777;padding:30px}
  @media(max-width:800px){.wrap{flex-direction:column-reverse;height:auto}#map{height:340px;flex:none}#list{width:100%}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px"><img class="logo" src="https://raw.githubusercontent.com/Aonint12/images/main/pea_logo_big.png" alt="PEA"><div><h1>ประกาศงดจ่ายกระแสไฟฟ้า</h1><p>การไฟฟ้าส่วนภูมิภาคสาขาวัดสิงห์</p></div></div>
  <a class="addbtn" href="<?= adminUrl ?>" target="_top">➕ เพิ่ม / จัดการประกาศ (เจ้าหน้าที่)</a>
</header>
<div class="tabs">
  <button data-f="upcoming" class="on">วันนี้และที่จะถึง</button>
  <button data-f="today">วันนี้</button>
  <button data-f="past">ที่ผ่านมา</button>
</div>
<div class="wrap">
  <div id="list"><div class="empty">กำลังโหลด...</div></div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<?!= include('Shared') ?>
<script>
const CENTER = [15.17, 100.18]; // ปรับพิกัดกลางตามพื้นที่จริงของสาขา
let data = [], filter = 'upcoming', layers = {};

const sat = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, maxNativeZoom:18, crossOrigin:true, attribution:'Tiles © Esri'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, maxNativeZoom:18, crossOrigin:true})
]);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'});
const map = L.map('map', {layers:[sat]}).setView(CENTER, 12);
L.control.layers({'🛰 ดาวเทียม':sat, '🗺 แผนที่ถนน':osm}).addTo(map);
const group = L.featureGroup().addTo(map);

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; render();
});

function slotsHtml(o){ return slotsOf(o).map(s => '<div class="slot">'+esc(slotText(s))+'</div>').join(''); }

function render(){
  let rows = data.filter(o => { const k = kindOf(o); return filter==='today' ? k==='today' : filter==='past' ? k==='past' : k!=='past'; });
  rows.sort((a,b)=> filter==='past' ? sortKey(b).localeCompare(sortKey(a)) : sortKey(a).localeCompare(sortKey(b)));
  group.clearLayers(); layers = {};
  const list = document.getElementById('list');
  if(!rows.length){list.innerHTML='<div class="empty">ไม่มีประกาศในช่วงนี้</div>';return;}
  list.innerHTML = rows.map(o => {
    const k = kindOf(o);
    return `<div class="card ${k}" data-id="${esc(o.id)}">
      <span class="badge">${k==='today'?'🔴 ดับวันนี้':k==='past'?'สิ้นสุดแล้ว':'🟡 กำหนดการ'}${o.status&&o.status!=='ประกาศ'?' · '+esc(o.status):''}</span>
      <h3>${esc(o.area)}</h3>
      <div class="row"><b>วัน-เวลา:</b></div>${slotsHtml(o)}
      <div class="row"><b>สาเหตุ:</b> ${esc(o.reason)}</div>
      ${o.remark?`<div class="row"><b>หมายเหตุ:</b> ${esc(o.remark)}</div>`:''}
      <button class="pbtn" data-poster="${esc(o.id)}">🖼 ดูภาพประกาศ</button>
    </div>`;
  }).join('');
  rows.forEach(o => {
    if(!o.geojson) return;
    try{
      const gj = parseGeo(o.geojson), k = kindOf(o);
      const color = k==='today' ? '#ff2d55' : k==='past' ? '#adb5bd' : '#ffb000';
      const lyr = geoLayer(gj, color);
      lyr.bindPopup(`<b>${esc(o.area)}</b><br>${slotsOf(o).map(s=>esc(slotText(s))).join('<br>')}<br>${esc(o.reason)}${o.remark?'<br><i>'+esc(o.remark)+'</i>':''}`);
      lyr.addTo(group); layers[o.id] = lyr;
      gj.features.forEach(f => { if(f.geometry && f.geometry.type==='LineString')
        addLineEnds(group, f.geometry.coordinates.map(c => L.latLng(c[1], c[0]))); });
    }catch(e){}
  });
  document.querySelectorAll('.card').forEach(c => c.onclick = () => {
    const l = layers[c.dataset.id]; if(!l) return;
    map.fitBounds(l.getBounds(), {maxZoom:17, padding:[40,40]});
    l.openPopup(l.getBounds().getCenter());
  });
  document.querySelectorAll('.pbtn').forEach(b => b.onclick = ev => {
    ev.stopPropagation(); showPoster(data.find(o => o.id === b.dataset.poster));
  });
  if(group.getLayers().length) map.fitBounds(group.getBounds(), {maxZoom:15, padding:[30,30]});
}

google.script.run.withSuccessHandler(r => {data = r; render();})
  .withFailureHandler(e => document.getElementById('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</div>')
  .getOutages();
</script>
</body>
</html>
